<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenBLUP Studio</title>
  <meta name="description" content="Fit REML / BLUP mixed models in the browser: pedigree animal models, AR1 x AR1 spatial field trials and factor-analytic multi-environment trials, powered by the OpenBLUP engine compiled to WebAssembly.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M5 23c4 0 5-13 11-13s7 13 11 13' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='10' r='2.6' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="studio.css">
  <script>
    // Apply a saved or requested theme before the first paint.
    try {
      const q = new URLSearchParams(location.search).get("theme");
      const t = q || localStorage.getItem("openblup-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (_) { /* storage unavailable */ }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="OpenBLUP Studio home">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--accent)"/>
        <path d="M5 23c4 0 5-13 11-13s7 13 11 13" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="16" cy="10" r="2.6" fill="#fff"/>
      </svg>
      <span><span class="brand-name">OpenBLUP</span> <b>Studio</b></span>
    </a>
    <span class="badge" id="engine-badge"><span class="dot"></span><span>Loading engine…</span></span>
    <span class="topbar-spacer"></span>
    <a class="icon-btn" href="https://github.com/jakobrichert/openblup" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>GitHub</span>
    </a>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch colour theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Model setup"></aside>
    <main class="main" id="main"></main>
  </div>

  <div class="tooltip" id="tooltip" hidden></div>
  <noscript><p class="empty">OpenBLUP Studio needs JavaScript and WebAssembly.</p></noscript>
</body>
</html>
